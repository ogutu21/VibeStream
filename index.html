<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>VibeStream</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- HEADER -->
    <header class="header">

        <div class="logo">
            <span>♫</span>
            <strong>VibeStream</strong>
        </div>

        <div class="search-box">

            <input
                type="text"
                id="searchInput"
                placeholder="Search songs or artists..."
                autocomplete="off"
            >

            <button id="searchBtn" type="button">
                🔍
            </button>

        </div>

        <button class="profile-btn" type="button">
            👤
        </button>

    </header>


    <!-- PAGE -->
    <div class="page">

        <!-- SIDEBAR -->
        <aside class="sidebar">

            <h4>MENU</h4>

            <button class="menu-item active" type="button">
                🏠
                <span>Home</span>
            </button>

            <button class="menu-item" type="button">
                🔥
                <span>Trending</span>
            </button>

            <button class="menu-item" type="button">
                ❤️
                <span>Favorites</span>
            </button>

            <button class="menu-item" type="button">
                📚
                <span>Playlists</span>
            </button>

            <div class="sidebar-line"></div>

            <h4>YOUR MUSIC</h4>

            <button class="menu-item" type="button">
                🕘
                <span>Recently Played</span>
            </button>

            <button class="menu-item" type="button">
                ⭐
                <span>Favorite Songs</span>
            </button>

        </aside>


        <!-- MAIN CONTENT -->
        <main class="main-content">

            <!-- HERO -->
            <section class="hero">

                <div class="hero-content">

                    <p class="hero-label">
                        VIBESTREAM
                    </p>

                    <h1>
                        Music for
                        <span>every vibe.</span>
                    </h1>

                    <p class="hero-description">
                        Discover new music, explore artists,
                        and enjoy your favorite sounds online.
                    </p>

                    <button
                        class="discover-btn"
                        id="discoverBtn"
                        type="button"
                    >
                        Start Discovering
                    </button>

                </div>

            </section>


            <!-- MUSIC SECTION -->
            <section class="music-section">

                <div class="section-heading">

                    <div>
                        <h2>Discover Music</h2>

                        <p>
                            Find your next favorite track
                        </p>
                    </div>

                </div>


                <!-- MUSIC RESULTS -->
                <div
                    id="musicList"
                    class="music-grid"
                >

                    <div class="loading">

                        <div class="loading-spinner"></div>

                        <p>
                            Loading music...
                        </p>

                    </div>

                </div>

            </section>

        </main>

    </div>


    <!-- MUSIC PLAYER -->
    <div class="player">

        <!-- CURRENT SONG -->
        <div class="now-playing">

            <img
                id="currentArtwork"
                src="https://images.unsplash.com/photo-1511379938547-c1f69419868d?auto=format&fit=crop&w=200&q=80"
                alt="Album artwork"
            >

            <div class="song-details">

                <h3 id="currentTitle">
                    No song playing
                </h3>

                <p id="currentArtist">
                    Select a song to begin
                </p>

            </div>

        </div>


        <!-- PLAYER CONTROLS -->
        <div class="player-center">

            <div class="player-buttons">

                <button
                    type="button"
                    id="previousButton"
                    title="Previous"
                >
                    ⏮
                </button>

                <button
                    type="button"
                    id="playButton"
                    class="play-button"
                    title="Play / Pause"
                >
                    ▶
                </button>

                <button
                    type="button"
                    id="nextButton"
                    title="Next"
                >
                    ⏭
                </button>

            </div>


            <!-- PROGRESS -->
            <div class="progress-area">

                <span id="currentTime">
                    0:00
                </span>

                <input
                    type="range"
                    id="progressBar"
                    min="0"
                    max="100"
                    value="0"
                    step="0.1"
                >

                <span id="duration">
                    0:00
                </span>

            </div>

        </div>


        <!-- VOLUME -->
        <div class="volume-control">

            <span>
                🔊
            </span>

            <input
                type="range"
                id="volumeBar"
                min="0"
                max="1"
                value="1"
                step="0.01"
            >

        </div>

    </div>


    <!-- AUDIO -->
    <audio id="audioPlayer"></audio>


    <!-- JAVASCRIPT -->
    <script src="script.js"></script>

</body>

</html>
